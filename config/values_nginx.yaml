controller:
  progressDeadlineSeconds: 600
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
  # Snippet annotations can inject arbitrary NGINX directives and are unsafe
  # for a shared ingress controller.
  allowSnippetAnnotations: false
  config:
    enable-underscores-in-headers: true
  autoscaling:
    enabled: true
